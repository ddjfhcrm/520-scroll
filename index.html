<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>520顆愛意 · 點一句，成一箋</title>
<meta name="description" content="五百二十句溫柔，每一句都能單獨點開、單獨送人。" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%83</text></svg>" />
<style>
  :root{
    --paper:#f7eedd;
    --ink:#2f2723;
    --ink-soft:#6f5d4c;
    --cinnabar:#a8352a;
    --line:rgba(120,92,50,.13);
    --kai:"KaiTi","Kaiti SC","STKaiti","SimSun",serif;
    --song:"SimSun","Songti SC","Noto Serif SC",serif;
    --mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    min-height:100%;
    background:radial-gradient(120% 80% at 50% -10%, #fdf7ea 0%, #f7eedd 45%, #f1e5cf 100%);
    color:var(--ink);
    font-family:var(--kai);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.05'/></svg>");
  }

  #fx{
    position:fixed; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:25;
  }

  .wrap{ position:relative; z-index:1; width:min(720px,100%); margin:0 auto; padding:0 20px 90px; }

  header{ padding:clamp(38px,7vh,76px) 4px 0; text-align:center; }
  .kicker{
    margin:0; font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:10px; letter-spacing:.42em; text-indent:.42em; color:#c39a92;
  }
  h1{
    margin:12px 0 0; font-family:var(--song); font-weight:600;
    font-size:clamp(24px,4vw,34px); letter-spacing:.16em; text-indent:.16em; color:#43272a;
  }
  .sub{ margin:12px 0 0; font-size:13.5px; letter-spacing:.12em; color:#9a7a70; }
  .rule{
    margin:26px auto 0; width:min(560px,100%); height:1px;
    background:linear-gradient(90deg, transparent, rgba(120,92,50,.28), transparent);
  }

  .tools{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:10px;
    padding:14px 0 12px;
    background:linear-gradient(to bottom, #f8efe0 62%, rgba(248,239,224,0));
    backdrop-filter:blur(4px);
  }
  .search{
    flex:1; display:flex; align-items:center; gap:8px;
    background:rgba(255,252,246,.9);
    border:1px solid var(--line); border-radius:999px; padding:9px 15px;
  }
  .search input{
    flex:1; min-width:0; border:0; outline:0; background:transparent;
    font-family:var(--kai); font-size:14.5px; color:var(--ink); letter-spacing:.04em;
  }
  .search input::placeholder{ color:#bfa294; }
  .tools button{
    flex:0 0 auto; font-family:var(--kai); font-size:13px; letter-spacing:.1em;
    color:#6d3b42; padding:9px 15px; border-radius:999px; cursor:pointer;
    background:rgba(255,252,246,.9); border:1px solid var(--line);
    transition:background .2s, color .2s, transform .18s;
  }
  .tools button:hover{ background:#fff; color:#952f24; transform:translateY(-1px); }
  .tools button:focus-visible{ outline:2px solid #d99aa0; outline-offset:2px; }

  ol.list{ list-style:none; margin:0; padding:0; }
  ol.list li{ margin:0; }
  .row{
    width:100%; display:grid; grid-template-columns:58px 1fr 18px; align-items:baseline; gap:12px;
    padding:11px 8px; border:0; background:transparent; cursor:pointer;
    border-bottom:1px solid var(--line);
    font-family:var(--kai); font-size:16.5px; line-height:1.6; letter-spacing:.03em;
    color:#3a2d27; text-align:left;
    transition:background .18s, color .18s, padding-left .18s;
  }
  .row .no{ font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:#bd927f; transition:color .18s; }
  .row .tx{ text-wrap:pretty; }
  .row .go{ font-size:12px; color:transparent; transition:color .18s, transform .18s; }
  .row:hover, .row:focus-visible{ background:rgba(255,255,255,.62); padding-left:14px; outline:0; }
  .row:hover .no, .row:focus-visible .no{ color:var(--cinnabar); }
  .row:hover .go, .row:focus-visible .go{ color:#c98a7c; transform:translateX(2px); }
  .row.is-cur{ background:rgba(246,222,214,.55); }
  .row.is-cur .no{ color:var(--cinnabar); }
  .row.tap{ animation:tapPulse .45s ease; }
  @keyframes tapPulse{
    0%{ background:rgba(168,53,42,.16); }
    100%{ background:rgba(246,222,214,.55); }
  }
  .empty{ padding:40px 8px; color:#a9907f; font-size:14px; letter-spacing:.1em; text-align:center; }

  /* ---------- 箋 ---------- */
  .card-wrap{
    position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:20px;
  }
  .card-wrap[hidden]{ display:none; }
  .backdrop{
    position:absolute; inset:0; z-index:0;
    background:rgba(58,34,26,.30);
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    animation:fade .24s ease;
  }
  @keyframes fade{ from{ opacity:0; } }

  .card{
    position:relative; z-index:2; width:min(560px,100%);
    background:linear-gradient(180deg,#fffdf7,#fdf6e8);
    border:1px solid rgba(180,140,100,.3);
    border-radius:18px;
    padding:44px 34px 24px;
    box-shadow:0 30px 70px rgba(90,50,35,.28), inset 0 1px 0 rgba(255,255,255,.9);
    opacity:0;
    transform:translateY(12px) scale(.965);
    filter:blur(4px);
  }
  /* 花瓣落下來之後，箋慢慢浮出 */
  .card-wrap.ready .card{
    animation:emerge .58s cubic-bezier(.2,.85,.3,1) forwards;
  }
  @keyframes emerge{
    0%{ opacity:0; transform:translateY(12px) scale(.965); filter:blur(4px); }
    55%{ opacity:.9; filter:blur(.6px); }
    100%{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  }
  /* 正文逐字浮現 */
  .card-text .ch{ opacity:0; animation:chIn .5s ease forwards; }
  @keyframes chIn{
    from{ opacity:0; filter:blur(3px); }
    to{ opacity:1; filter:blur(0); }
  }
  .card::before{
    content:""; position:absolute; inset:9px; border:1px solid rgba(168,53,42,.16); border-radius:12px; pointer-events:none;
  }
  .seal{
    position:absolute; left:26px; top:-18px;
    width:52px; height:52px; display:grid; place-items:center;
    background:var(--cinnabar); color:#fdf3e4; border-radius:5px;
    font-family:var(--mono); font-size:13px; letter-spacing:.02em;
    box-shadow:0 6px 18px rgba(140,50,35,.28), inset 0 0 0 2px rgba(255,240,225,.3);
    transform:rotate(-3deg);
  }
  /* 最後蓋下印章 */
  .card-wrap.ready .seal{
    animation:stamp .44s cubic-bezier(.2,1.55,.4,1) .62s both;
  }
  @keyframes stamp{
    0%{ transform:rotate(-3deg) scale(1.9); opacity:0; }
    55%{ opacity:1; }
    100%{ transform:rotate(-3deg) scale(1); opacity:1; }
  }
  .card-text{
    margin:0; font-family:var(--kai);
    font-size:clamp(20px,3.4vw,27px); line-height:1.85; letter-spacing:.05em;
    color:#33251f; text-align:center; text-wrap:balance; min-height:2em;
  }
  .card-meta{
    margin:18px 0 0; text-align:center;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; color:#b0917f;
  }
  .card-actions{ display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-top:24px; }
  .card-actions button{
    font-family:var(--kai); font-size:13px; letter-spacing:.1em; color:#6d3b42;
    padding:9px 16px; border-radius:999px; cursor:pointer;
    background:rgba(255,255,255,.8); border:1px solid var(--line);
    transition:background .18s, color .18s, transform .18s;
  }
  .card-actions button:hover{ background:#fff; color:#952f24; transform:translateY(-1px); }
  .card-actions .primary{ background:var(--cinnabar); border-color:var(--cinnabar); color:#fdf3e4; }
  .card-actions .primary:hover{ background:#93291f; color:#fff; }
  .card-link{
    display:block; width:fit-content; margin:16px auto 0;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.12em;
    color:#b08a76; text-decoration:none; border-bottom:1px solid transparent;
    transition:color .18s, border-color .18s;
  }
  .card-link:hover{ color:var(--cinnabar); border-bottom-color:rgba(168,53,42,.35); }

  .toast{
    position:fixed; left:50%; bottom:36px; transform:translate(-50%,14px);
    padding:10px 18px; border-radius:999px;
    background:rgba(47,35,28,.9); color:#f8efe0;
    font-family:var(--kai); font-size:13px; letter-spacing:.1em;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:30;
  }
  .toast.on{ opacity:1; transform:translate(-50%,0); }

  footer{
    margin-top:34px; text-align:center; color:#b0917f;
    font-family:var(--mono); font-size:10px; letter-spacing:.18em;
  }

  @media (max-width:560px){
    .row{ grid-template-columns:44px 1fr 14px; font-size:15.5px; padding:10px 6px; }
    .card{ padding:40px 22px 20px; }
    .card-actions{ gap:7px; }
    .card-actions button{ padding:8px 13px; font-size:12.5px; }
  }
  @media (prefers-reduced-motion: reduce){
    .card, .card-wrap, .row.tap{ animation:none; }
  }
</style>
</head>

  <div class="wrap">
    <header>
      <p class="kicker">520 pieces of tenderness</p>
      <h1>點一句，成一箋</h1>

  function pad(n) { var s = String(n); while (s.length < 3) s = "0" + s; return s; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ================= 花瓣特效 ================= */
  var fxCanvas = document.getElementById("fx");
  var fx = fxCanvas.getContext("2d");
  var petals = [];
  var rafId = 0;
  var lastT = 0;

  function fxResize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    fxCanvas.width = Math.round(window.innerWidth * dpr);
    fxCanvas.height = Math.round(window.innerHeight * dpr);
    fxCanvas.style.width = window.innerWidth + "px";
    fxCanvas.style.height = window.innerHeight + "px";
    fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // 花瓣從指尖上方飄落
  function burst(x, y) {
    if (reduce) return;
    var n = 18;
    for (var i = 0; i < n; i++) {
      petals.push({
        x: x + (Math.random() - 0.5) * 300,
        y: y - 60 - Math.random() * 260,
        vx: (Math.random() - 0.5) * 26,
        vy: 46 + Math.random() * 74,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 2.4,
        sway: Math.random() * Math.PI * 2,
        swayAmp: 10 + Math.random() * 26,
        size: 6 + Math.random() * 7,
        tilt: 0.35 + Math.random() * 0.5,
        life: 0,
        ttl: 1.3 + Math.random() * 0.9,
        hue: Math.random()
      });
    }
    if (!rafId) { lastT = performance.now(); rafId = requestAnimationFrame(loopFx); }
  }

  function drawPetal(p, a) {
    fx.save();
    fx.translate(p.x, p.y);
    fx.rotate(p.rot);
    fx.scale(1, p.tilt);
    fx.globalAlpha = a;

    var g = fx.createRadialGradient(-p.size * 0.3, -p.size * 0.3, p.size * 0.1, 0, 0, p.size);
    if (p.hue < 0.55) {
      g.addColorStop(0, "#ffe3e6");
      g.addColorStop(0.6, "#f6bcc4");
      g.addColorStop(1, "#e6949f");
    } else {
      g.addColorStop(0, "#fff0e6");
      g.addColorStop(0.6, "#f7d3c4");
      g.addColorStop(1, "#e8ad9c");
    }
    fx.fillStyle = g;
    fx.beginPath();
    fx.ellipse(0, 0, p.size, p.size * 0.62, 0, 0, Math.PI * 2);
    fx.fill();

    // 花瓣的脈絡
    fx.globalAlpha = a * 0.35;
    fx.strokeStyle = "#c9767f";
    fx.lineWidth = 0.8;
    fx.beginPath();
    fx.moveTo(-p.size * 0.7, 0);
    fx.quadraticCurveTo(0, p.size * 0.18, p.size * 0.7, 0);
    fx.stroke();

    fx.restore();
    fx.globalAlpha = 1;
  }

  function loopFx(t) {
    var dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    fx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    for (var i = petals.length - 1; i >= 0; i--) {
      var p = petals[i];
      p.life += dt;
      if (p.life >= p.ttl || p.y > window.innerHeight + 40) { petals.splice(i, 1); continue; }

      p.sway += dt * 1.6;
      p.vx += Math.cos(p.sway) * p.swayAmp * dt * 2.2;
      p.vx *= 0.985;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;

      var k = p.life / p.ttl;
      var a = Math.min(1, k * 6) * (1 - Math.pow(k, 3));
      drawPetal(p, a * 0.92);
    }

    if (petals.length) {
      rafId = requestAnimationFrame(loopFx);
    } else {
      rafId = 0;
      fx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }
  }

  function writeText(str) {
    textEl.textContent = "";
    if (reduce) { textEl.textContent = str; return; }
    for (var i = 0; i < str.length; i++) {
      var s = document.createElement("span");
      s.className = "ch";
      s.textContent = str.charAt(i);
      s.style.animationDelay = (0.26 + i * 0.045).toFixed(3) + "s";
      textEl.appendChild(s);
    }
  }

  function open(i, x, y) {
    if (i < 0 || i >= LINES.length) return;
    var wasOpen = !wrapEl.hidden;
    current = i;
    sealEl.textContent = pad(i + 1);
    writeText(LINES[i]);
    metaEl.textContent = "第 " + (i + 1) + " 顆 · 共 " + LINES.length + " 顆";
    if (cardLink) cardLink.href = "520長卷.html#" + (i + 1);

    for (var k = 0; k < rows.length; k++) {
      rows[k].classList.toggle("is-cur", Number(rows[k].dataset.i) === i);
    }

    // 先亮遮罩（火花在上面飛），再讓箋浮上來
    clearTimeout(openTimer);
    wrapEl.hidden = false;

    if (typeof x === "number" && typeof y === "number") {
      burst(x, y);
    } else {
      var r = rows[i].getBoundingClientRect();
      burst(r.left + 40, r.top + r.height / 2);
    }

    if (wasOpen || reduce) {
      wrapEl.classList.add("ready");
    } else {
      wrapEl.classList.remove("ready");
      openTimer = setTimeout(function () { wrapEl.classList.add("ready"); }, 300);
    }

    if (history.replaceState) {
      history.replaceState(null, "", "#" + (i + 1));
    } else {
      location.hash = String(i + 1);
    }
    document.title = LINES[i] + " · 520顆愛意";
  }

  function close() {
    clearTimeout(openTimer);
    wrapEl.classList.remove("ready");
    wrapEl.hidden = true;
    current = -1;
    for (var k = 0; k < rows.length; k++) rows[k].classList.remove("is-cur");
    if (history.replaceState) history.replaceState(null, "", location.pathname + location.search);
    document.title = "520顆愛意 · 點一句，成一箋";
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove("on"); }, 1500);
  }

  function copy(str, okMsg) {
    var done = function () { toast(okMsg); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(str).then(done, function () { fallback(str, done); });
    } else {
      fallback(str, done);
    }
  }

  function fallback(str, done) {
    var ta = document.createElement("textarea");
    ta.value = str;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("複製失敗，長按選中吧"); }
    ta.remove();
  }

  function linkOf(i) {
    return location.origin + location.pathname + "#" + (i + 1);
  }

  /* ================= 事件 ================= */
  listEl.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".row") : null;
    if (!btn) return;
    btn.classList.remove("tap");
    void btn.offsetWidth;
    btn.classList.add("tap");
    open(Number(btn.dataset.i), e.clientX, e.clientY);
  });

  document.getElementById("btnClose").addEventListener("click", close);
  wrapEl.addEventListener("click", function (e) { if (e.target === wrapEl) close(); });

  document.getElementById("btnCopyText").addEventListener("click", function () {
    if (current >= 0) copy(LINES[current], "這句已經複製好了");
  });
  document.getElementById("btnCopyLink").addEventListener("click", function () {
    if (current >= 0) copy(linkOf(current), "鏈接已複製，發給TA試試");
  });

  document.getElementById("btnRandom").addEventListener("click", function (e) {
    var r = e.currentTarget.getBoundingClientRect();
    open(Math.floor(Math.random() * LINES.length), r.left + r.width / 2, r.top + r.height / 2);
  });

  window.addEventListener("keydown", function (e) {
    if (!wrapEl.hidden) {
      if (e.key === "Escape") { close(); }
      else if (e.key === "ArrowRight") { open((current + 1) % LINES.length); }
      else if (e.key === "ArrowLeft") { open((current - 1 + LINES.length) % LINES.length); }
    }
  });

  qEl.addEventListener("input", function () {
    var q = qEl.value.trim();
    var shown = 0;
    for (var k = 0; k < rows.length; k++) {
      var hit = !q || rows[k].querySelector(".tx").textContent.indexOf(q) >= 0;
      rows[k].parentNode.style.display = hit ? "" : "none";
      if (hit) shown++;
    }
    emptyEl.hidden = shown > 0;
  });

  /* ================= 深鏈接 ================= */
  function fromHash() {
    var m = /^#(\d+)$/.exec(location.hash || "");
    if (!m) return false;
    var n = parseInt(m[1], 10);
    if (n >= 1 && n <= LINES.length) { open(n - 1); return true; }
    return false;
  }

  window.addEventListener("hashchange", function () {
    if (!fromHash()) close();
  });

  fxResize();
  build();
  if (fromHash()) {
    var r0 = rows[current] && rows[current].getBoundingClientRect();
    if (r0) burst(r0.left + 40, r0.top + r0.height / 2);
  }
})();
</script>
</body>
</html>
