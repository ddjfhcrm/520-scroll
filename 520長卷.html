<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>520顆愛意堆積溫柔 · 長卷</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%9C</text></svg>" />
<style>
  :root{
    --fs: 32px;
    --gap: 20px;
    --pad: 72px;
    --ink: #2f2723;
    --ink-soft: #6f5d4c;
    --cinnabar: #a8352a;
    --paper: #f7eedd;
    --kai: "KaiTi","Kaiti SC","STKaiti","SimSun",serif;
    --song: "SimSun","Songti SC","Noto Serif SC","Source Han Serif SC",serif;
    --mono: ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; overflow:hidden; overscroll-behavior:none;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--kai);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- 卷面 ---------- */
  .paper-wrap{
    position:fixed; inset:0; overflow:hidden;
    touch-action:none; user-select:none; -webkit-user-select:none;
    cursor:grab;
    background:
      radial-gradient(120% 90% at 50% 40%, #fbf4e6 0%, #f6ecd9 45%, #efe2ca 100%);
  }
  .paper-wrap.dragging{ cursor:grabbing; }

  .scroll{
    position:absolute; top:0; left:0; height:100%;
    display:flex; align-items:stretch;
    will-change:transform;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.055'/></svg>"),
      repeating-linear-gradient(96deg, rgba(120,92,50,.028) 0 1px, rgba(255,255,255,0) 1px 7px);
    background-repeat:repeat, repeat;
  }

  .band{
    position:relative;
    display:flex; align-items:stretch;
    height:100%;
    padding:var(--pad) 0;
  }

  /* 天頭地腳的雙界欄 */
  .rule{ position:absolute; left:0; right:0; height:9px; pointer-events:none; }
  .rule::before, .rule::after{
    content:""; position:absolute; left:0; right:0; height:1px;
  }
  .rule::before{ top:0; background:rgba(96,72,44,.24); }
  .rule::after{ top:6px; background:rgba(96,72,44,.11); }
  .rule-t{ top:calc(var(--pad) - 1px); }
  .rule-b{ bottom:calc(var(--pad) - 8px); }

  /* 隔水（綾絹） */
  .silk{
    flex:0 0 auto; width:76px; height:100%;
    background:
      repeating-linear-gradient(45deg, rgba(120,95,58,.06) 0 2px, rgba(120,95,58,0) 2px 7px),
      repeating-linear-gradient(-45deg, rgba(120,95,58,.04) 0 1px, rgba(120,95,58,0) 1px 6px),
      linear-gradient(180deg, #e9dcc0 0%, #e2d3b2 55%, #dbcbaa 100%);
    border-left:1px solid rgba(116,88,52,.22);
    border-right:1px solid rgba(116,88,52,.22);
    box-shadow:inset 0 0 42px rgba(140,110,60,.12);
    position:relative;
  }
  .silk::after{
    content:""; position:absolute; top:12%; bottom:12%; left:50%; width:1px;
    background:rgba(120,92,50,.10);
  }

  /* ---------- 卷首 ---------- */
  .preface, .coda{
    flex:0 0 auto;
    writing-mode:vertical-rl;
    padding:0 26px;
    position:relative;
  }
  .preface h1{
    margin:0;
    font-family:var(--song);
    font-size:46px; padding-top:8px;
    font-weight:400;
    letter-spacing:.1em;
    line-height:1.32;
    color:#33231c;
    text-shadow:0 1px 0 rgba(255,255,255,.5);
  }
  .preface .sub{
    margin:0 0 0 22px;
    font-size:17px;
    letter-spacing:.18em;
    line-height:2.2;
    color:var(--ink-soft);
  }
  .preface .note{
    margin:0 0 0 20px;
    font-size:12px;
    letter-spacing:.24em;
    line-height:2.4;
    color:#98836c;
  }
  .pre-mark{
    position:absolute; left:26px; top:-4px;
    writing-mode:horizontal-tb;
    font-family:var(--song); font-size:12px; letter-spacing:.3em;
    color:rgba(168,53,42,.55);
  }
  .preface .seal{ position:absolute; left:28px; bottom:22px; }
  .preface .lead{
    position:absolute; left:28px; bottom:104px;
    width:96px; height:1px; background:rgba(116,88,52,.22);
    writing-mode:horizontal-tb;
  }

  /* 印章 */
  .seal{
    writing-mode:horizontal-tb;
    display:grid; place-items:center;
    width:62px; height:62px;
    background:#a8352a; color:#fbf1e2;
    border-radius:4px;
    font-family:var(--song); font-size:19px; line-height:1;
    box-shadow:0 2px 12px rgba(140,40,30,.28), inset 0 0 0 2px rgba(255,240,225,.35);
    transform:rotate(-2.5deg);
    opacity:.95;
  }
  .seal.four{ grid-template-columns:1fr 1fr; width:70px; height:70px; font-size:20px; }
  .seal.two{ grid-template-columns:1fr; width:56px; height:74px; font-size:19px; gap:4px; }
  .seal-sm{
    position:absolute; left:36px; bottom:36px;
    width:44px; height:44px; font-size:14px; border-radius:3px;
    grid-template-columns:1fr 1fr; transform:rotate(2deg);
  }

  /* ---------- 正文列 ---------- */
  .cols{ display:flex; gap:var(--gap); padding:0 6px; }
  .col{ display:flex; flex-direction:column; }
  .line{
    margin:0; flex:1 1 auto; min-height:0; padding-top:5px;
    writing-mode:vertical-rl;
    text-orientation:mixed;
    font-family:var(--kai);
    font-size:var(--fs);
    line-height:1.44;
    letter-spacing:.07em;
    color:rgba(47,39,35,var(--a,.94));
    transition:color .25s ease;
  }
  .col:hover .line{ color:var(--cinnabar); }
  .idx{
    flex:0 0 26px; padding-bottom:4px;
    display:flex; align-items:flex-end; justify-content:center;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.04em;
    color:rgba(150,104,60,.5);
    transition:color .25s ease;
  }
  .col:hover .idx{ color:var(--cinnabar); }

  /* ---------- 卷尾 ---------- */
  .coda{ padding-left:40px; padding-right:54px; }
  .coda .big{
    margin:0; font-family:var(--song); font-size:34px; letter-spacing:.3em; line-height:2;
    color:#3a281f;
  }
  .coda .sub{
    margin:0 0 0 22px; font-size:17px; letter-spacing:.16em; line-height:2.3; color:var(--ink-soft);
  }
  .coda .meta{
    margin:0 0 0 22px; font-size:12px; letter-spacing:.22em; line-height:2.5; color:#9a8570;
  }
  .coda .seal{ position:absolute; left:44px; bottom:96px; }

  /* ---------- 氛圍 ---------- */
  .vignette{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:
      radial-gradient(130% 100% at 50% 50%, rgba(120,86,40,0) 42%, rgba(120,86,40,.10) 100%),
      linear-gradient(180deg, rgba(120,86,40,.10), rgba(120,86,40,0) 12% 88%, rgba(120,86,40,.12));
  }
  .fade{
    position:fixed; inset:0; pointer-events:none; z-index:6;
    background:#f7eedd; opacity:0;
  }

  /* ---------- 界面 ---------- */
  .hud{
    position:fixed; left:0; right:0; bottom:0; z-index:7;
    padding:0 18px calc(14px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:10px;
    pointer-events:none;
    transition:opacity .45s ease, transform .45s ease;
  }
  .hud.idle{ opacity:0; transform:translateY(10px); }
  .rail{ position:relative; height:2px; background:rgba(120,88,50,.16); border-radius:2px; }
  .rail i{
    position:absolute; left:0; top:0; height:100%; width:0;
    background:linear-gradient(90deg, rgba(168,53,42,.55), rgba(168,53,42,.9));
    border-radius:2px;
  }
  .rail b{
    position:absolute; top:50%; left:0; width:9px; height:9px; margin:-4.5px 0 0 -4.5px;
    border-radius:50%; background:#fdf7ea; border:1.5px solid rgba(168,53,42,.85);
    box-shadow:0 1px 4px rgba(120,60,40,.3);
  }
  .hud-row{
    display:flex; align-items:center; gap:12px;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; color:#7a6147;
  }
  .pos b{ font-size:14px; color:#7a3a2f; letter-spacing:0; font-variant-numeric:tabular-nums; }
  .pos em{ font-style:normal; color:#a4907a; margin-left:4px; }
  .hud-row .dash{ flex:1; text-align:center; color:rgba(141,114,85,.8); }
  .tools{ display:flex; gap:7px; pointer-events:auto; }
  .tools button{
    font-family:var(--kai); font-size:12.5px; letter-spacing:.12em; color:#6d5140;
    padding:7px 13px; border-radius:999px; cursor:pointer;
    background:rgba(253,247,234,.82);
    border:1px solid rgba(120,88,50,.24);
    transition:background .2s, color .2s, transform .2s;
  }
  .tools button:hover{ background:#fdf7ea; color:#8f2f24; transform:translateY(-1px); }
  .tools button.on{ background:#a8352a; border-color:#a8352a; color:#fbf1e2; }

  /* 錄屏模式：去掉一切界面與動效 */
  body.capture .hud{ display:none !important; }
  body.capture .line, body.capture .idx{ transition:none; }
  body.capture .paper-wrap{ cursor:default; }

  /* 4:5 畫幅（1080×1350）專用排版 */
  html.r45{ --fs:28px; --gap:18px; --pad:64px; }
  html.r45 .silk{ width:64px; }
  html.r45 .preface h1{ font-size:44px; }
  html.r45 .preface .sub{ font-size:16px; }
  html.r45 .coda .big{ font-size:34px; }
  html.r45 .line{ letter-spacing:.06em; }

  /* 4:3 畫幅（1440×1080）專用排版 */
  html.r43{ --fs:38px; --gap:28px; --pad:150px; }
  html.r43 .silk{ width:92px; }
  html.r43 .preface h1{ font-size:56px; }
  html.r43 .preface .sub{ font-size:21px; }
  html.r43 .coda .big{ font-size:42px; }
  html.r43 .line{ letter-spacing:.07em; }

  @media (max-width:620px){
    .hud{ padding:0 14px calc(10px + env(safe-area-inset-bottom)); gap:9px; }
    .hud-row{ font-size:10px; gap:8px; }
    .hud-row .dash{ display:none; }
    .pos{ margin-right:auto; }
    .pos b{ font-size:13px; }
    .pos em{ font-size:9.5px; }
    .tools{ gap:6px; }
    .tools button{ padding:7px 11px; font-size:12px; letter-spacing:.06em; }
  }
  @media (min-width:900px){
    :root{ --fs:34px; --gap:26px; --pad:104px; }
    .preface h1{ font-size:54px; }
    .preface .sub{ font-size:20px; }
    .coda .big{ font-size:40px; }
  }
  @media (prefers-reduced-motion: reduce){
    .hud{ transition:none; }
  }
</style>
</head>
<body>

    <div class="scroll" id="scroll">
      <div class="band">
        <div class="rule rule-t"></div>
        <div class="rule rule-b"></div>

        <div class="silk"></div>

        <section class="preface">
          <h1>五百二十顆愛意堆積溫柔</h1>
          <p class="sub">一顆一顆，堆成一顆心</p>
          <p class="note">丙午年 手錄</p>

        <div class="cols" id="cols"></div>

          <p class="meta">二〇二六年十一月十一日</p>
          <div class="seal two" aria-hidden="true"><span>贈</span><span>你</span></div>
        </section>

        <div class="silk"></div>
      </div>
    </div>
  </div>

  <div class="vignette" aria-hidden="true"></div>
  <div class="fade" id="fade" aria-hidden="true"></div>

  <div class="hud" id="hud">

      <div class="tools">

        <button id="btnHome" type="button">卷首</button>

      </div>
    </div>
  </div>

  <noscript><div style="position:fixed;inset:0;display:grid;place-items:center;background:#f7eedd">需要開啓 JavaScript 才能展開這卷。</div></noscript>

<script>

  var wrap = document.getElementById("wrap");
  var scroll = document.getElementById("scroll");
  var colsEl = document.getElementById("cols");
  var hud = document.getElementById("hud");
  var railFill = document.getElementById("railFill");
  var knob = document.getElementById("knob");
  var posNum = document.getElementById("posNum");
  var fade = document.getElementById("fade");

  var captureMode = /[?&]capture=1/.test(location.search);
  if (captureMode) document.body.classList.add("capture");
  if (/[?&]ratio=45/.test(location.search)) document.documentElement.classList.add("r45");
  if (/[?&]ratio=43/.test(location.search)) document.documentElement.classList.add("r43");

  var s = { pos: 0, goal: 0, max: 0, drag: false, auto: false, t: 0 };
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- 建列 ---------- */
  function build() {
    var frag = document.createDocumentFragment();
    for (var i = 0; i < LINES.length; i++) {
      var col = document.createElement("div");
      col.className = "col";

      var line = document.createElement("p");
      line.className = "line";
      line.textContent = LINES[i];
      line.style.setProperty("--a", (0.9 + (i % 6) * 0.016).toFixed(3));

      var idx = document.createElement("span");
      idx.className = "idx";
      var n = String(i + 1);
      while (n.length < 3) n = "0" + n;
      idx.textContent = n;

      col.appendChild(line);
      col.appendChild(idx);
      frag.appendChild(col);
    }
    colsEl.appendChild(frag);
  }

  /* ---------- 尺寸 ---------- */
  function measure() {
    s.max = Math.max(0, scroll.getBoundingClientRect().width - window.innerWidth);
    if (s.pos > s.max) s.pos = s.goal = s.max;
  }

  function clamp(v) { return v < 0 ? 0 : v > s.max ? s.max : v; }

  function apply() {
    scroll.style.transform = "translate3d(" + (-s.pos) + "px,0,0)";
    var p = s.max > 0 ? s.pos / s.max : 0;
    railFill.style.width = (p * 100).toFixed(2) + "%";
    knob.style.left = (p * 100).toFixed(2) + "%";
    var n = Math.round(p * (LINES.length - 1)) + 1;
    var txt = String(n);
    while (txt.length < 3) txt = "0" + txt;
    posNum.textContent = txt;
  }

  /* ---------- 主循環 ---------- */
  function tick(now) {
    requestAnimationFrame(tick);
    var dt = Math.min(now - (s.t || now), 48);
    s.t = now;

    if (s.auto) {
      s.goal = clamp(s.goal + dt * 0.045);
      if (s.goal >= s.max - 0.5) setAuto(false);
    }

    if (!s.drag) {
      var k = 1 - Math.pow(0.001, dt / 1000);   // 與幀率無關的阻尼
      var d = s.goal - s.pos;
      if (Math.abs(d) < 0.35) { s.pos = s.goal; } else { s.pos += d * k; }
      apply();
    }
  }

  /* ---------- 交互 ---------- */
  var dragStart = { x: 0, pos: 0, t: 0 };
  var lastMove = { x: 0, t: 0, v: 0 };

  wrap.addEventListener("pointerdown", function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    s.drag = true;
    s.auto = false; setAutoBtn(false);
    dragStart.x = e.clientX; dragStart.pos = s.pos; dragStart.t = performance.now();
    lastMove.x = e.clientX; lastMove.t = dragStart.t; lastMove.v = 0;
    wrap.classList.add("dragging");
    try { if (wrap.setPointerCapture) wrap.setPointerCapture(e.pointerId); } catch (err) {}
    poke();
  });

  wrap.addEventListener("pointermove", function (e) {
    if (!s.drag) { poke(); return; }
    var now = performance.now();
    var dx = e.clientX - dragStart.x;
    s.pos = s.goal = clamp(dragStart.pos - dx);
    var dtm = now - lastMove.t;
    if (dtm > 8) {
      lastMove.v = (e.clientX - lastMove.x) / dtm;
      lastMove.x = e.clientX; lastMove.t = now;
    }
    apply();
  });

  function endDrag(e) {
    if (!s.drag) return;
    s.drag = false;
    wrap.classList.remove("dragging");
    var v = lastMove.v;
    if (Math.abs(v) > 0.15) s.goal = clamp(s.pos - v * 260);
    apply();
  }
  wrap.addEventListener("pointerup", endDrag);
  wrap.addEventListener("pointercancel", endDrag);
  wrap.addEventListener("pointerleave", function (e) { if (s.drag) endDrag(e); });

  wrap.addEventListener("wheel", function (e) {
    e.preventDefault();
    var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    s.goal = clamp(s.goal + d * (e.deltaMode === 1 ? 18 : 1));
    s.auto = false; setAutoBtn(false);
    poke();
  }, { passive: false });

  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); s.goal = clamp(s.goal + window.innerWidth * 0.7); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); s.goal = clamp(s.goal - window.innerWidth * 0.7); }
    else if (e.key === "Home") { e.preventDefault(); s.goal = 0; }
    else if (e.key === "End") { e.preventDefault(); s.goal = s.max; }
    else return;
    s.auto = false; setAutoBtn(false);
    poke();
  });

  var autoBtn = document.getElementById("btnAuto");
  function setAuto(on) { s.auto = on; setAutoBtn(on); }
  function setAutoBtn(on) { autoBtn.classList.toggle("on", !!on); autoBtn.textContent = on ? "暫停展開" : "自動展開"; }
  autoBtn.addEventListener("click", function () { setAuto(!s.auto); });

  document.getElementById("btnHome").addEventListener("click", function () { s.goal = 0; });
  document.getElementById("btnEnd").addEventListener("click", function () { s.goal = s.max; });

  /* 界面自動隱去 */
  var idleTimer = 0;
  function poke() {
    if (captureMode) return;
    hud.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { hud.classList.add("idle"); }, 2600);
  }
  ["pointermove", "pointerdown", "wheel", "keydown", "touchstart"].forEach(function (ev) {
    window.addEventListener(ev, poke, { passive: true });
  });

  /* ---------- 錄屏接口 ---------- */
  var DURATION = 120;
  var PAN_IN = 2.0;
  var PAN_OUT = 114.0;
  var FADE_IN = 1.6;
  var FADE_OUT_START = 118.0;

  // 運鏡曲線：起步緩、中段穩、收尾慢慢停住
  function camEase(u) {
    var a = 0.12;
    var total = 1 - a;
    if (u <= 0) return 0;
    if (u >= 1) return 1;
    var d;
    if (u < a) {
      var t0 = u / a;
      d = a * t0 * t0 / 2;
    } else if (u > 1 - a) {
      var t1 = (1 - u) / a;
      d = total - a * t1 * t1 / 2;
    } else {
      d = a / 2 + (u - a);
    }
    return d / total;
  }

  window.__cap = {
    duration: DURATION,
    ready: false,
    seek: function (t) {
      var u = (t - PAN_IN) / (PAN_OUT - PAN_IN);
      u = u < 0 ? 0 : u > 1 ? 1 : u;
      s.pos = s.goal = s.max * camEase(u);
      apply();

      var fo = 0;
      if (t < FADE_IN) fo = 1 - t / FADE_IN;
      if (t > FADE_OUT_START) fo = Math.min(1, (t - FADE_OUT_START) / (DURATION - FADE_OUT_START));
      fade.style.opacity = fo.toFixed(3);

      return { x: s.pos, max: s.max, fade: fo };
    }
  };

  /* ---------- 定位到某一顆（#260） ---------- */
  function jumpToHash() {
    var m = /^#(\d+)$/.exec(location.hash || "");
    if (!m) return false;
    var n = parseInt(m[1], 10);
    if (!(n >= 1 && n <= LINES.length)) return false;
    var col = colsEl.children[n - 1];
    if (!col) return false;
    var x = col.getBoundingClientRect().left;
    s.pos = s.goal = clamp(x - window.innerWidth * 0.45);
    apply();
    return true;
  }

  /* ---------- 啓動 ---------- */
  function start() {
    measure();
    s.pos = s.goal = 0;
    apply();
    jumpToHash();
    if (!captureMode && !reduce) poke();
    else hud.classList.add("idle");
    window.__cap.ready = true;
    requestAnimationFrame(tick);
  }

  build();
  measure();

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(start);
    setTimeout(function () { if (!window.__cap.ready) start(); }, 900);
  } else {
    setTimeout(start, 60);
  }

  var rt = 0;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { measure(); apply(); }, 120);
  });

  window.addEventListener("hashchange", function () {
    if (!jumpToHash()) { s.goal = 0; }
  });
})();
</script>
</body>
</html>
